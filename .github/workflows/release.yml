name: Release

# 主分支每次更新后：跑测试 -> 按 Conventional Commits 计算版本 -> 打 tag + 发布 Release
on:
  push:
    branches:
      - main

# 串行执行，避免多次 push 并发打出冲突的 tag
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sq
        uses: ./.github/actions/install-sq

      - name: Run tests
        # Turns a broken sq install into a failure instead of a silent skip.
        env:
          DATABASE_CLI_REQUIRE_SQ: "1"
        run: python -m unittest discover -s tests -p "test_*.py" -v

  release:
    name: Tag & Release
    needs: test
    runs-on: ubuntu-latest
    # 跳过机器人/合并产生的空提交场景可在此扩展条件
    steps:
      - uses: actions/checkout@v4
        with:
          # 计算版本需要完整历史与已有 tag
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # dry_run：只算版本、先不打 tag。版本号要先写进文件、提交，tag 才能落在
      # 带有正确版本号的那个提交上；否则 tag 指向的永远是上一个版本的内容。
      - name: Determine next version
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # 沿用现有 vX.Y.Z 命名
          tag_prefix: v
          # 非 feat/fix 提交（如 docs/chore）默认按 patch 递增，
          # 保证主分支每次更新都会产出新版本；如只想在 feat/fix 时发版，
          # 改为 default_bump: false
          default_bump: patch
          release_branches: main
          dry_run: true

      - name: Sync version into manifest and MCP server
        if: steps.tag.outputs.new_tag != ''
        run: |
          set -euo pipefail
          python .github/scripts/set_version.py "${{ steps.tag.outputs.new_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "版本号已是最新，无需提交"
          else
            git add .codex-plugin/plugin.json skills/database-cli/scripts/database-mcp
            # [skip ci] 避免这次回写又触发一轮发版
            git commit -m "chore(release): 同步版本号到 ${{ steps.tag.outputs.new_tag }} [skip ci]"
          fi

      - name: Tag and push
        if: steps.tag.outputs.new_tag != ''
        run: |
          set -euo pipefail
          git tag -a "${{ steps.tag.outputs.new_tag }}" -m "${{ steps.tag.outputs.new_tag }}"
          git push origin HEAD:main
          git push origin "${{ steps.tag.outputs.new_tag }}"

      - name: Create GitHub Release
        if: steps.tag.outputs.new_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}
