name: CI

# main 也要跑：release.yml 现在只在 release / hotfix 分支触发，
# 若这里继续忽略 main，直接推到 main 的提交将完全没有 CI 覆盖。
on:
  pull_request:
  push:

# 同一分支/PR 只保留最新一次运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install sq
        uses: ./.github/actions/install-sq

      - name: Run tests
        # Turns a broken sq install into a failure instead of a silent skip.
        env:
          DATABASE_CLI_REQUIRE_SQ: "1"
        run: python -m unittest discover -s tests -p "test_*.py" -v
